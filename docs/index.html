<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Wet-Lab Workflow Map</title>
  <meta name="description" content="A structural map of biological laboratory work, organized so that every workflow has exactly one place.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <h1>The Wet-Lab Workflow Map</h1>
      <p class="lede">
        This taxonomy was built the MECE way, mutually exclusive and collectively exhaustive, to map out the outputs of wet-lab bench work.
      </p>
    </div>
  </header>

  <div class="controls">
    <div class="wrap controls-inner">
      <div class="search-wrap">
        <label>Keyword search
          <input type="search" id="search" aria-label="Keyword search" autocomplete="off">
        </label>
      </div>
      <div class="selects">
        <label>Research area
          <select id="area" aria-label="Filter by research area"><option value="">Any</option></select>
        </label>
        <label>Material
          <select id="material" aria-label="Filter by material"><option value="">Any</option></select>
        </label>
      </div>
      <div class="buttons">
        <div class="toggle" role="group" aria-label="View">
          <button type="button" id="viewMap" class="btn seg is-on" aria-pressed="true">Map</button>
          <button type="button" id="viewList" class="btn seg" aria-pressed="false">List</button>
        </div>
        <button type="button" id="expand" class="btn" hidden>Expand all</button>
        <button type="button" id="collapse" class="btn" hidden>Collapse all</button>
      </div>
    </div>
  </div>

  <main class="wrap">
    <div id="map" class="map">
      <div class="columns" id="columns"></div>
    </div>
    <div id="tree" class="tree" hidden></div>
    <p class="empty" id="empty" hidden>Nothing matches those filters. Try a broader search.</p>
  </main>

  <footer class="wrap footer">
    <p>
      The structure, the splitting rule and a critical review are in
      <a href="https://github.com/cykim5/bio-workflow-taxonomy/blob/main/TAXONOMY.md">TAXONOMY.md</a>.
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
